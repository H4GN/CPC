name: Build CPC APK
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check repo structure
        run: |
          pwd
          ls -R
          if [ ! -f pubspec.yaml ]; then
            echo "pubspec.yaml root eke neha. subfolder check karanawa..."
            if [ -f cpc-app/pubspec.yaml ]; then
              echo "cpc-app/ folder eken files root ekata gannawa..."
              cp -rf cpc-app/* .
              ls -R
            else
              echo "ERROR: pubspec.yaml hamu noviya! lib/ saha pubspec.yaml repo root ekata upload karanna."
              exit 1
            fi
          fi

      - name: Generate Android Project
        run: flutter create --platforms=android --org com.cr8ive --project-name cpc_app .

      - name: Set App Name
        run: sed -i 's/android:label="[^"]*"/android:label="CPC"/' android/app/src/main/AndroidManifest.xml

      - name: Create App Icon
        run: |
          pip install pillow
          mkdir -p assets/icon tools
          # logo.png root eke dammoth ekath gannawa
          if [ ! -f assets/icon/logo.png ]; then
            if [ -f logo.png ]; then cp logo.png assets/icon/logo.png; fi
            if [ -f assets/logo.png ]; then cp assets/logo.png assets/icon/logo.png; fi
          fi
          cat > tools/make_icons.py << 'PYEOF'
          from PIL import Image, ImageDraw
          import os
          S = 1024
          logo_path = "assets/icon/logo.png"
          if os.path.exists(logo_path):
              print("Logo found, using it")
              logo = Image.open(logo_path).convert("RGBA").resize((S, S), Image.LANCZOS)
          else:
              print("WARNING: assets/icon/logo.png not found, using placeholder icon")
              logo = Image.new("RGBA", (S, S), (11, 58, 99, 255))
              d = ImageDraw.Draw(logo)
              d.ellipse([S*0.2, S*0.2, S*0.8, S*0.8], fill=(255,255,255,255))
              d.text((S*0.40, S*0.46), "CPC", fill=(11,58,99,255))
          mask = Image.new("L", (S, S), 0)
          ImageDraw.Draw(mask).rounded_rectangle((0, 0, S, S), radius=int(S*0.16), fill=255)
          logo.putalpha(mask)
          def make(scale, bg):
              canvas = Image.new("RGBA", (S, S), bg)
              size = int(S*scale)
              l = logo.resize((size, size), Image.LANCZOS)
              canvas.paste(l, ((S-size)//2, (S-size)//2), l)
              return canvas
          make(0.62, (255,255,255,0)).save("assets/icon/icon_fg.png")
          make(0.80, (255,255,255,255)).save("assets/icon/icon_full.png")
          print("Icon done")
          PYEOF
          python tools/make_icons.py
          flutter pub get
          dart run flutter_launcher_icons || echo "Icon step skipped, continue build"

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload CPC APK
        uses: actions/upload-artifact@v4
        with:
          name: CPC-APK
          path: build/app/outputs/flutter-apk/app-release.apk
