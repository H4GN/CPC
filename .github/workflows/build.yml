name: Build CPC APK
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Android project generate
        run: flutter create --platforms=android --org com.cr8ive --project-name cpc_app .

      - name: App name = CPC
        run: sed -i 's/android:label="[^"]*"/android:label="CPC"/' android/app/src/main/AndroidManifest.xml

      - name: Icons (white background)
        run: |
          pip install pillow
          python tools/make_icons.py
          flutter pub get
          dart run flutter_launcher_icons

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: CPC-APK
          path: build/app/outputs/flutter-apk/app-release.apk
